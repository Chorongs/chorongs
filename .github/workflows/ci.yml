name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend          # 모든 run 단계를 frontend/에서 실행
    steps:
      - uses: actions/checkout@v4            # 코드 받기
      - uses: actions/setup-node@v4          # Node.js, npm 설정
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci                          # 의존성 설치 (package-lock.json 기준)
      - run: npm run lint
      - run: npm test                        # vitest run (1회 실행)
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # ./mvnw -B test 는 DB 없이 통과하는 테스트가 develop에 생기면 추가 (contextLoads는 Oracle 필요)
      - run: ./mvnw -B -Psast compile spotbugs:check
